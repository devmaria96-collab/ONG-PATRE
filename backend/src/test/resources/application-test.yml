spring:
  datasource:
    url: jdbc:h2:mem:patre;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-key-must-be-at-least-32-chars
  expiration-ms: 3600000

app:
  admin:
    email: admin@patre.org
    password: admin123

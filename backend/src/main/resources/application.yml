server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: patre-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/patre}
    username: ${DATABASE_USERNAME:patre}
    password: ${DATABASE_PASSWORD:patre}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET:dev-only-change-this-secret-key-32chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006}

app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@patre.org}
    password: ${APP_ADMIN_PASSWORD:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
